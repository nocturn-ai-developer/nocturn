# Builds the installers that nocturnh.com links to: Windows .exe, macOS .dmg and Android .apk.
# Runs on every version tag (v0.2.0 …) and attaches the files to a GitHub release, so the
# Download buttons on the site can point at .../releases/latest/download/<file>.
name: Apps

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build installer
        run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
          if-no-files-found: error

  android:
    name: Android
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      # ubuntu-latest already ships the Android SDK at $ANDROID_HOME.
      - run: npm install
      - name: Build debug-signed APK
        run: |
          test -d android || npm run android:add
          npm run icons
          npm run sync
          cd android && chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - run: cp android/app/build/outputs/apk/debug/app-debug.apk Nocturn.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: mobile/Nocturn.apk

  release:
    name: Publish release
    needs: [desktop, android]
    # Publish whatever was built, even when one platform failed.
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: files
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: files/*
          generate_release_notes: true
